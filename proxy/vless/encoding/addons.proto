syntax = "proto3";

package xray.proxy.vless.encoding;
option csharp_namespace = "Xray.Proxy.Vless.Encoding";
option go_package = "github.com/xtls/xray-core/proxy/vless/encoding";
option java_package = "com.xray.proxy.vless.encoding";
option java_multiple_files = true;

message Addons {
  string Flow = 1;
  bytes Seed = 2;
  // CUSTOM: AuthVerified (server→client) signals successful auth for remote validator feature.
  bool AuthVerified = 3;
  // CUSTOM: ClientVersion (client→server) carries client app version for tower validation/enforcement.
  string ClientVersion = 4;
}
